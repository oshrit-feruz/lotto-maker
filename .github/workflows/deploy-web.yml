name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx expo export --platform web
        working-directory: packages/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || '' }}

      - name: Fix asset paths and set entry page
        run: |
          sed -i 's|src="/_expo/|src="./_expo/|g' packages/mobile/dist/index.html
          touch packages/mobile/dist/.nojekyll
          cp demo/mobile-mockup.html packages/mobile/dist/demo.html
          # If a live backend URL is configured, Expo app is the main page;
          # otherwise fall back to the standalone HTML demo.
          if [ -n "${{ vars.EXPO_PUBLIC_API_URL }}" ]; then
            echo "Backend configured — Expo app at /"
          else
            mv packages/mobile/dist/index.html packages/mobile/dist/app.html
            cp demo/mobile-mockup.html packages/mobile/dist/index.html
            echo "No backend — demo at /"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/mobile/dist
          force_orphan: true
